name: Local video lab regression tests

# Mac launchd is the automatic scheduler. GitHub Actions manual-only by design.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline video-lab regression tests
        run: python -m unittest discover -s tests -v
