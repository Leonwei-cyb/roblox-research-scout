name: Roblox research scout (no AI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'watch/config.json'
      - 'watch/feeds.json'
      - '.github/workflows/research.yml'
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: write

concurrency:
  group: public-research-scout
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (offline)
        run: python3 -m unittest discover -s tests -v
      - name: Collect public source updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/scout.py
          github_status=$?
          python3 scripts/media_scout.py
          media_status=$?
          if [ "$media_status" -eq 0 ]; then
            python3 scripts/video_shortlist.py
            shortlist_status=$?
            if [ "$shortlist_status" -ne 0 ]; then exit "$shortlist_status"; fi
          fi
          if [ "$github_status" -ne 0 ] && [ "$media_status" -ne 0 ]; then
            echo "Both public source collectors failed."
            exit 1
          fi
      - name: Commit reports only on changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A watch/
          if git diff --cached --quiet; then
            echo 'No changed public report.'
          else
            git commit -m 'Refresh public research leads'
            git push
          fi
