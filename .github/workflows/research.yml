name: Roblox research scout (no AI)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'watch/config.json'
      - 'watch/feeds.json'
      - 'watch/creators.json'
      - 'watch/official_visual_pages.json'
      - '.github/workflows/research.yml'
  schedule:
    # Hourly research refresh; collector honors per-source rate-limit cooldowns.
    # Do not poll social feeds every 5 minutes: avoid 429s and pointless repeats.
    # GitHub may delay scheduled starts; workflow_dispatch handles urgent refreshes.
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: public-research-scout
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check scheduler ownership
        id: ownership
        run: python3 scripts/scheduler_owner.py --owner github --job research >> "$GITHUB_OUTPUT"
      - name: Unit tests (offline)
        if: steps.ownership.outputs.enabled == 'true'
        run: python3 -m unittest discover -s tests -v
      - name: Collect public source updates
        if: steps.ownership.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/scout.py
          github_status=$?
          python3 scripts/bot_supervisor.py
          supervisor_status=$?
          python3 scripts/license_watch.py
          license_status=$?
          python3 scripts/media_scout.py
          media_status=$?
          # Source-linked original developer still images, at most once per 24 hours.
          python3 scripts/official_visual_scout.py
          visuals_status=$?
          if [ "$visuals_status" -ne 0 ]; then echo 'Original visual source index failed.'; exit 1; fi
          python3 scripts/research_quality.py
          quality_status=$?
          python3 scripts/failure_triage.py
          triage_status=$?
          if [ "$quality_status" -ne 0 ] || [ "$triage_status" -ne 0 ]; then exit 1; fi
          if [ "$media_status" -eq 0 ]; then
            python3 scripts/video_shortlist.py
            shortlist_status=$?
            python3 scripts/creator_digest.py
            creator_status=$?
            python3 scripts/research_dispatcher.py
            queue_status=$?
            if [ "$shortlist_status" -ne 0 ] || [ "$creator_status" -ne 0 ] || [ "$queue_status" -ne 0 ]; then exit 1; fi
          fi
          if [ "$supervisor_status" -ne 0 ]; then echo "Bot health supervisor failed."; exit 1; fi
          if [ "$license_status" -ne 0 ]; then echo "Public license audit failed."; exit 1; fi
          # A partially successful run must never be presented as all bots passing.
          echo '### Collector outcome (public only)' >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub repo scout exit: $github_status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public feeds exit: $media_status" >> "$GITHUB_STEP_SUMMARY"
          if [ -f watch/source_health.md ]; then
            sed -n '1,7p' watch/source_health.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$github_status" -ne 0 ] || [ "$media_status" -ne 0 ]; then
            echo "::warning::Partial research failure. One collector could not complete; inspect logs and source health."
            echo '**PARTIAL FAILURE:** At least one collector could not complete.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$github_status" -ne 0 ] && [ "$media_status" -ne 0 ]; then
            echo "Both public source collectors failed."
            exit 1
          fi
      - name: Commit reports only on changes
        if: steps.ownership.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A watch/
          if git diff --cached --quiet; then
            echo 'No changed public report.'
          else
            git commit -m 'Refresh public research leads'
            # The owner may edit config while this run is gathering feeds.
            # Rebase the REPORT-ONLY commit onto the latest main; never force-push.
            for try in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo 'Report conflicts with newer source; next scheduled run will retry.'
                exit 0
              fi
              if git push origin HEAD:main; then
                echo 'Research reports committed.'
                exit 0
              fi
              sleep 2
            done
            echo 'Concurrent update; next scheduled run will retry without force-pushing.'
            exit 0
          fi
