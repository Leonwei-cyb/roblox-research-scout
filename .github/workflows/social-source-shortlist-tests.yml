name: Social source shortlist offline tests
on:
  pull_request:
    paths:
      - 'scripts/social_original_shortlist.py'
      - 'tests/test_social_original_shortlist.py'
      - '.github/workflows/social-source-shortlist-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline original-source classification tests
        run: python3 -m unittest discover -s tests -p 'test_social_original_shortlist.py' -v
      - name: Generate offline shortlist with current saved metadata
        run: python3 scripts/social_original_shortlist.py
