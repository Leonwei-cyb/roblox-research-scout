name: Discovery regression tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'watch/discovery.json'
      - 'findings/reviews/**'
      - '.github/workflows/discovery*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run the whole offline suite
        run: python -m unittest discover -s tests -v
